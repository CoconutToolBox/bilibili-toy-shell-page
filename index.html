<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>椰果工具箱</title>
        <script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
        <style>
            :root {
                color-scheme: dark;
                --bg: #000000;
                --accent: #6366f1;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: var(--bg);
            }
            /* 桌面视口容器：iframe 按 1280px 宽渲染桌面布局，缩放适配当前屏幕（JS 计算 scale） */
            .frame-wrap {
                position: fixed;
                top: 0;
                left: 0;
                transform-origin: top left;
            }
            iframe {
                width: 100%;
                height: 100%;
                border: 0;
                display: block;
            }
            .loader {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                font-size: 13px;
                color: rgba(232, 228, 240, 0.6);
                background: var(--bg);
                z-index: 5;
            }
            .loader[hidden] {
                display: none;
            }
            .loader-spinner {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                border: 2px solid rgba(255, 255, 255, 0.15);
                border-top-color: var(--accent);
                animation: spin 0.9s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            /* 横屏引导层：竖屏触摸设备提示旋转，旋转后自动隐藏，可「继续竖屏浏览」跳过 */
            #rotate-hint {
                position: fixed;
                inset: 0;
                z-index: 90;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                padding: 32px;
                text-align: center;
                background: #000000;
                color: #e8e4f0;
                transition: opacity 0.3s ease;
            }
            #rotate-hint[hidden] {
                display: none;
            }
            .rotate-icon {
                width: 72px;
                height: 72px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fb7299;
                animation: rotate-bounce 1.6s ease-in-out infinite;
            }
            .rotate-title {
                font-size: 18px;
                font-weight: 600;
            }
            .rotate-sub {
                font-size: 13px;
                color: rgba(232, 228, 240, 0.6);
                max-width: 280px;
            }
            /* 打开访问名单按钮：空心粉框粉字，hover 反色 */
            .open-rank-btn {
                margin-top: 6px;
                padding: 10px 22px;
                border: 1.5px solid #fb7299;
                border-radius: 10px;
                background: transparent;
                color: #fb7299;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                transition: background 0.2s ease, color 0.2s ease;
            }
            .open-rank-btn:hover {
                background: #fb7299;
                color: #ffffff;
            }
            .open-rank-btn:active {
                transform: scale(0.97);
            }
            @keyframes rotate-bounce {
                0%,
                100% {
                    transform: rotate(0deg);
                }
                50% {
                    transform: rotate(90deg);
                }
            }
            /* ── 今日访问名单弹窗 ─────────────────────────────────── */
            #rank-overlay {
                position: fixed;
                inset: 0;
                z-index: 200;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: rgba(0, 0, 0, 0.72);
                backdrop-filter: blur(3px);
            }
            #rank-overlay[hidden] {
                display: none;
            }
            .rank-modal {
                width: min(420px, 100%);
                max-height: 82vh;
                display: flex;
                flex-direction: column;
                border: 1px solid rgba(232, 228, 240, 0.14);
                border-radius: 14px;
                background: #141318;
                color: #e8e4f0;
                overflow: hidden;
                box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
            }
            .rank-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 16px 18px;
                border-bottom: 1px solid rgba(232, 228, 240, 0.1);
            }
            .rank-title {
                font-size: 16px;
                font-weight: 600;
            }
            .rank-sub {
                margin-top: 3px;
                font-size: 12px;
                color: rgba(232, 228, 240, 0.55);
            }
            .rank-close {
                flex: none;
                width: 30px;
                height: 30px;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 0;
                border-radius: 8px;
                background: rgba(232, 228, 240, 0.08);
                color: #e8e4f0;
                font-size: 18px;
                line-height: 1;
                cursor: pointer;
            }
            .rank-close:hover {
                background: rgba(232, 228, 240, 0.18);
            }
            .rank-body {
                overflow-y: auto;
                padding: 8px 0;
            }
            .rank-hint {
                padding: 28px 18px;
                text-align: center;
                font-size: 13px;
                color: rgba(232, 228, 240, 0.55);
            }
            .rank-hint.error {
                color: #f87171;
            }
            .rank-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 18px;
            }
            .rank-item .rank-badge {
                flex: none;
                width: 28px;
                text-align: center;
                font-size: 15px;
                font-weight: 700;
                color: rgba(232, 228, 240, 0.85);
            }
            .rank-item .rank-avatar {
                flex: none;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                object-fit: cover;
                background: rgba(232, 228, 240, 0.12);
            }
            .rank-item .rank-name {
                flex: 1;
                font-size: 14px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        </style>
    </head>
    <body>
        <div id="loader" class="loader">
            <div class="loader-spinner"></div>
            <span>正在加载椰果工具箱…</span>
        </div>

        <div id="rotate-hint" hidden>
            <div class="rotate-icon">
                <svg viewBox="0 0 24 24" width="56" height="56" fill="currentColor" aria-hidden="true">
                    <path
                        d="M12,5V1L7,6L12,11V7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12H5A7,7 0 0,0 12,19A7,7 0 0,0 19,12A7,7 0 0,0 12,5M12,23V19A7,7 0 0,0 5,12H7A5,5 0 0,0 12,17Z"
                    />
                </svg>
            </div>
            <div class="rotate-title">建议横屏使用</div>
            <div class="rotate-sub">旋转设备至横屏可获得最佳浏览体验</div>
            <button type="button" class="open-rank-btn" id="open-rank">看看谁也在用？</button>
        </div>

        <div id="frame-wrap" class="frame-wrap">
            <iframe
                id="frame"
                title="椰果工具箱"
                src="https://wuwa-hpyg-tool.200503.xyz/"
                allow="fullscreen; autoplay; clipboard-write"
            ></iframe>
        </div>

        <!-- 今日访问弹窗：点击横屏遮罩里的「看看谁也在用？」按钮触发 -->
        <div id="rank-overlay" hidden>
            <div class="rank-modal" id="rank-modal">
                <div class="rank-head">
                    <div>
                        <div class="rank-title">今日访问名单</div>
                        <div class="rank-sub" id="rank-sub">今天有 0 位椰果访问工具箱。</div>
                    </div>
                    <button type="button" class="rank-close" id="rank-close" aria-label="关闭">×</button>
                </div>
                <div class="rank-body" id="rank-body"></div>
            </div>
        </div>

        <script>
            const frame = document.getElementById('frame');
            const loader = document.getElementById('loader');
            const wrap = document.getElementById('frame-wrap');

            // ── 桌面视口适配 ──────────────────────────────────────────
            // 手机等窄屏：iframe 固定 1280px 宽渲染桌面布局，等比缩放到屏幕宽度；
            // 桌面（≥1280px）：不缩放，全屏。
            const DESKTOP_WIDTH = 1280;
            function applyViewport() {
                const scale = Math.min(1, window.innerWidth / DESKTOP_WIDTH);
                wrap.style.width = DESKTOP_WIDTH + 'px';
                wrap.style.height = Math.ceil(window.innerHeight / scale) + 'px';
                wrap.style.transform = scale < 1 ? `scale(${scale})` : 'none';
            }
            window.addEventListener('resize', applyViewport);
            window.addEventListener('orientationchange', () => setTimeout(applyViewport, 200));
            applyViewport();

            // ── 横屏引导 ────────────────────────────────────────────
            // 无法强制系统横屏，竖屏触摸设备显示提示层（不可跳过），旋转后自动隐藏。
            const rotateHint = document.getElementById('rotate-hint');
            function isPortraitCoarse() {
                return window.innerHeight > window.innerWidth && window.matchMedia('(pointer: coarse)').matches;
            }
            function updateRotateHint() {
                rotateHint.hidden = !isPortraitCoarse()
            }
            window.addEventListener('resize', updateRotateHint);
            window.addEventListener('orientationchange', () => setTimeout(updateRotateHint, 200));
            updateRotateHint();

            // ── 自动认证（静默）───────────────────────────────────────
            // 已有未过期的 B站 用户授权 → 自动复用直接成功；从未授权（平台要求手势）
            // → 自动调用被拦，静默降级（无任何提示），主站功能不受影响。
            let profileSent = false;
            let lastProfile = null;
            function waitForSdk(timeoutMs) {
                const start = Date.now();
                return new Promise((resolve) => {
                    const timer = setInterval(() => {
                        if (typeof window.toy?.getUserProfile === 'function') {
                            clearInterval(timer);
                            resolve(true);
                        } else if (Date.now() - start > timeoutMs) {
                            clearInterval(timer);
                            resolve(false);
                        }
                    }, 100);
                });
            }
            function sendProfile(profile) {
                if (!frame.contentWindow || !profile) return;
                frame.contentWindow.postMessage({ type: 'toy-profile', profile }, '*');
                profileSent = true;
                lastProfile = profile;
            }
            async function autoAuth() {
                const ready = await waitForSdk(8000);
                if (!ready) return
                try {
                    const profile = await window.toy.getUserProfile();
                    sendProfile(profile);
                } catch {
                    // 静默：未授权/手势要求，不做任何提示
                }
            }
            autoAuth();

            // ── 打开壳页时静默上报一次分数 ──────────────────────────────
            // 借用 B站 Toy 分数榜把「今日访问」变成「今日上报过分数的人」：
            // 每个打开壳页的用户向 board=1 提交一次固定分数（分数本身不重要），
            // 这样它当天就会出现在今日日榜里，壳页即可通过 getRankList 读出访问名单。
            // 需用户已登录；首次提交前平台做用户数据确认，被拦则静默忽略，不弹任何框。
            const VISIT_BOARD = 1;
            const VISIT_SCORE = 1;
            function submitVisitScore() {
                if (typeof window.toy?.submitScore !== 'function') return Promise.resolve();
                return window.toy
                    .submitScore({ board: VISIT_BOARD, score: VISIT_SCORE })
                    .then(() => {
                        // 成功：捕获异常用 try/catch 不必，除非 reject
                    })
                    .catch(() => {
                        // 静默：未登录 / 未授权 / 手势要求，不做任何提示
                    });
            }
            async function registerVisit() {
                const ready = await waitForSdk(8000);
                if (!ready) return;
                await submitVisitScore();
            }
            // 延迟一点再触发，避免与自动认证争夺手势/初始化，也不阻塞 iframe 加载
            setTimeout(registerVisit, 600);

            // ── hash 透传 ────────────────────────────────────────────
            // 壳页自身 URL 的 hash（#import_project= / #websocket= / #reset-cache 等）
            // 同步到 iframe src，主站加载后由其 hash 动作系统自动分发
            function frameBase() {
                const src = frame.getAttribute('src') || '';
                return src.split('#')[0];
            }
            function syncFrameHash() {
                const target = frameBase() + (location.hash || '');
                if (frame.src !== target) frame.src = target;
            }
            window.addEventListener('hashchange', syncFrameHash);
            syncFrameHash();

            // ── iframe 加载 ──────────────────────────────────────────
            // 隐藏 loader；无条件重发 toy-environment（告知主站在 Toy 壳内，与认证结果无关），
            // 若身份已获取过则同时重发 toy-profile（hash 透传会触发导航）
            function resendEnvironment() {
                if (!frame.contentWindow) return;
                frame.contentWindow.postMessage({ type: 'toy-environment' }, '*');
            }
            function resendProfile() {
                if (!profileSent || !frame.contentWindow || !lastProfile) return;
                frame.contentWindow.postMessage({ type: 'toy-profile', profile: lastProfile }, '*');
            }
            function scheduleResend() {
                [300, 800, 1500].forEach((ms) => setTimeout(resendEnvironment, ms));
                if (profileSent) {
                    [300, 800, 1500].forEach((ms) => setTimeout(resendProfile, ms));
                }
            }
            resendEnvironment();
            frame.addEventListener('load', () => {
                loader.hidden = true;
                scheduleResend();
            });

            // ── 今日访问弹窗 ────────────────────────────────────────
            // 点击横屏遮罩里的「看看谁也在用？」按钮 → toy.getRankList({board:1, period:'day', limit:100})
            // 展示今日访问人数与名单（Toy 榜，游客可读，无需手势确认）。
            const RANK_BOARD = 1;
            const RANK_PERIOD = 'day';
            const RANK_LIMIT = 100;

            const rankOverlay = document.getElementById('rank-overlay');
            const rankSub = document.getElementById('rank-sub');
            const rankBody = document.getElementById('rank-body');
            const rankClose = document.getElementById('rank-close');
            const openRankBtn = document.getElementById('open-rank');

            function escapeHtml(str) {
                return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            function openRankOverlay() {
                rankOverlay.hidden = false;
            }

            function closeRankOverlay() {
                rankOverlay.hidden = true;
            }

            function setRankHint(text, isError = false) {
                rankBody.innerHTML = '';
                const hint = document.createElement('div');
                hint.className = 'rank-hint' + (isError ? ' error' : '');
                hint.textContent = text;
                rankBody.appendChild(hint);
            }

            function renderVisitList(list) {
                if (!list || list.length === 0) {
                    rankSub.textContent = '今天有 0 位椰果访问工具箱。';
                    setRankHint('今日暂无访问记录');
                    return;
                }
                rankSub.textContent = `今天有 ${list.length} 位椰果访问工具箱。`;
                rankBody.innerHTML = '';
                const frag = document.createDocumentFragment();
                list.forEach((item, i) => {
                    const row = document.createElement('div');
                    row.className = 'rank-item';

                    const badge = document.createElement('span');
                    badge.className = 'rank-badge';
                    badge.textContent = String(i + 1);

                    const avatar = document.createElement('img');
                    avatar.className = 'rank-avatar';
                    avatar.alt = '';
                    avatar.loading = 'lazy';
                    if (item.avatar) {
                        avatar.src = item.avatar.replace(/^\/\//, 'https://');
                        avatar.onerror = () => (avatar.style.visibility = 'hidden');
                    } else {
                        avatar.style.visibility = 'hidden';
                    }

                    const name = document.createElement('span');
                    name.className = 'rank-name';
                    name.textContent = item.nickname || '匿名';
                    name.title = item.nickname || '';

                    row.append(badge, avatar, name);
                    frag.appendChild(row);
                });
                rankBody.appendChild(frag);
            }

            async function loadTodayRank() {
                openRankOverlay();
                rankSub.textContent = '加载中…';
                setRankHint('正在获取今日访问名单…');
                const ready = await waitForSdk(8000);
                if (!ready || typeof window.toy?.getRankList !== 'function') {
                    setRankHint('需在 B站 Toy 环境内查看今日访问名单', true);
                    return;
                }
                try {
                    const list = await window.toy.getRankList({ board: RANK_BOARD, period: RANK_PERIOD, limit: RANK_LIMIT });
                    renderVisitList(list);
                } catch (e) {
                    setRankHint('获取名单失败：' + (e?.message ?? e), true);
                }
            }

            if (openRankBtn) {
                // 点击切换：打开弹窗并加载；已打开时再点则关闭
                openRankBtn.addEventListener('click', () => {
                    if (rankOverlay.hidden) {
                        loadTodayRank();
                    } else {
                        closeRankOverlay();
                    }
                });
            }
            if (rankClose) rankClose.addEventListener('click', closeRankOverlay);
            if (rankOverlay) {
                // 点击遮罩空白（非弹窗本体）关闭
                rankOverlay.addEventListener('click', (e) => {
                    if (e.target === rankOverlay) closeRankOverlay();
                });
            }
        </script>
    </body>
</html>
