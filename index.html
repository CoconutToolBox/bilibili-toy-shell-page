<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>椰果工具箱</title>
    <!-- Toy JS SDK：加载后挂载全局 window.toy，类型声明见 toy.d.ts -->
    <script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- 加载层：iframe 就绪前展示 -->
    <div id="loader" class="loader">
        <div class="loader-spinner"></div>
        <span>正在加载椰果工具箱…</span>
    </div>

    <!-- 横屏提示层：竖屏触摸设备提示旋转；App 内可点「切换横屏」强制 -->
    <div id="rotate-hint" hidden>
        <div class="rotate-icon">
            <svg viewBox="0 0 24 24" width="56" height="56" fill="currentColor" aria-hidden="true">
                <path
                    d="M12,5V1L7,6L12,11V7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12H5A7,7 0 0,0 12,19A7,7 0 0,0 19,12A7,7 0 0,0 12,5M12,23V19A7,7 0 0,0 5,12H7A5,5 0 0,0 12,17Z" />
            </svg>
        </div>
        <div class="rotate-title">建议横屏使用</div>
        <div class="rotate-sub">旋转设备至横屏可获得最佳浏览体验</div>
        <button type="button" class="rotate-btn" id="rotate-btn">切换横屏</button>
    </div>

    <!-- 桌面视口容器：#frame 由 script.js 在页面加载完成后动态挂载（绕过静态 iframe 拦截） -->
    <div id="frame-wrap" class="frame-wrap"></div>

    <!-- 壳页脚本：视口适配、横屏控制、身份透传等 -->
    <script src="script.js"></script>
</body>

</html>
